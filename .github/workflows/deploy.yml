name: CI/CD

# Se déclenche à chaque push sur master. Les tests tournent partout ; le déploiement
# n'a lieu que sur le dépôt de déploiement (brainstore), pas sur le miroir herve.
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  # ── 1. Tests (barrière : bloque le déploiement s'ils échouent) ──────────────
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements/local.txt
      - name: Run tests
        env:
          SECRET_KEY: ci-test-secret-key
          DJANGO_SETTINGS_MODULE: config.settings.local
        run: python -m pytest -q

  # ── 2. Déploiement backend → Railway ────────────────────────────────────────
  deploy-backend:
    needs: test
    if: github.repository == 'zealot19/brainstore'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Railway CLI
        run: npm i -g @railway/cli
      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --ci --service "${{ vars.RAILWAY_SERVICE || 'erp-backend' }}"

  # ── 3. Déploiement frontend → Vercel ────────────────────────────────────────
  deploy-frontend:
    needs: test
    if: github.repository == 'zealot19/brainstore'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: angular
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Vercel CLI
        run: npm i -g vercel@latest
      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Build
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Deploy
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
