<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 252 64" width="252" height="64" role="img" aria-label="Brainstore Group">
  <defs>
    <linearGradient id="bsgMark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A7CD6"/>
      <stop offset="1" stop-color="#092C4C"/>
    </linearGradient>
  </defs>
  <!-- Mark: rounded square + connected-nodes glyph (integrated platform) -->
  <rect x="6" y="6" width="52" height="52" rx="15" fill="url(#bsgMark)"/>
  <g stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round">
    <line x1="32" y1="21" x2="21" y2="43"/>
    <line x1="32" y1="21" x2="43" y2="43"/>
    <line x1="21" y1="43" x2="43" y2="43"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="32" cy="21" r="5"/>
    <circle cx="21" cy="43" r="4.6"/>
    <circle cx="43" cy="43" r="4.6"/>
  </g>
  <!-- Wordmark -->
  <text x="74" y="35" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="27" font-weight="800" letter-spacing="-0.6" fill="#092C4C">Brainstore</text>
  <text x="75" y="52" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10.5" font-weight="600" letter-spacing="6.5" fill="#0068B8">GROUP</text>
</svg>
