<div class="account-content">
  <div class="login-wrapper bg-img">
    <div class="login-content authent-content">
      <form class="digit-group" (ngSubmit)="submit()">
        <div class="login-userset">

          <div class="login-logo logo-normal">
            <img src="assets/img/logo.svg" alt="img">
          </div>
          <a [routerLink]="routes.signIn" class="login-logo logo-white">
            <img src="assets/img/logo-white.svg" alt="Img">
          </a>

          <div>
            <div class="login-userheading">
              <h3>2 Step Verification</h3>
              <h4>Enter the 6-digit code from your authenticator app.</h4>
            </div>

            <!-- Alerte erreur -->
            <div class="alert alert-danger py-2 mb-3" *ngIf="errorMsg">
              <i class="ti ti-alert-circle me-1"></i>{{ errorMsg }}
            </div>

            <div class="text-center otp-input">
              <div class="d-flex align-items-center justify-content-center mb-3">
                <p-inputotp [(ngModel)]="otpValue" name="otp" [length]="6" />
              </div>
            </div>

            <div class="mb-3">
              <button type="submit" class="btn btn-primary w-100"
                      [disabled]="loading || otpValue.length < 6">
                <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
                Verify
              </button>
            </div>

            <div class="signinform text-center">
              <h4>Return to <a [routerLink]="routes.signIn" class="hover-a">login</a></h4>
            </div>
          </div>

          <div class="my-4 d-flex justify-content-center align-items-center copyright-text">
            <p>Copyright &copy; 2025 BrainstoreGroup</p>
          </div>

        </div>
      </form>
    </div>
  </div>
</div>
