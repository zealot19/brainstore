<div class="page-header"><div class="add-item d-flex"><div class="page-title"><h4>{{ 'report.title' | transloco }}</h4><h6>{{ 'report.subtitle' | transloco }}</h6></div></div></div>
<app-info-banner [text]="'report.info' | transloco"></app-info-banner>
<div class="card"><div class="card-body">
  <div class="row g-3">
    <div class="col-md-6">
      <label class="form-label">{{ 'report.f_report' | transloco }}</label>
      <select class="form-select" [ngModel]="selectedCode" (ngModelChange)="select($event)">
        @for (r of reports; track r.code) { <option [value]="r.code">{{ r.name }}</option> }
      </select>
    </div>
    <div class="col-md-3">
      <label class="form-label">{{ 'report.f_format' | transloco }}</label>
      <select class="form-select" [(ngModel)]="format">
        <option value="pdf">PDF</option><option value="xlsx">Excel</option><option value="csv">CSV</option>
      </select>
    </div>
  </div>

  <!-- Filtres du rapport — rendus dynamiquement d'après les métadonnées du catalogue -->
  <div class="row g-3 mt-1">
    @for (spec of current?.filters; track spec.key) {
      <div class="col-md-3">
        <label class="form-label">{{ spec.label }}</label>
        @switch (spec.type) {
          @case ('select') {
            <select class="form-select" [(ngModel)]="f[spec.key]">
              <option value="">{{ 'report.opt_all_f' | transloco }}</option>
              @for (o of optionsFor(spec); track o.value) { <option [value]="o.value">{{ o.label }}</option> }
            </select>
          }
          @case ('number') { <input type="number" class="form-control" [(ngModel)]="f[spec.key]"> }
          @case ('date')   { <input type="date" class="form-control" [(ngModel)]="f[spec.key]"> }
          @case ('datetime') { <input type="date" class="form-control" [(ngModel)]="f[spec.key]"> }
          @default { <input type="text" class="form-control" [(ngModel)]="f[spec.key]"> }
        }
      </div>
    }
  </div>

  <div class="mt-3"><button class="btn btn-primary" [disabled]="!selectedCode || loading" (click)="generate()">
    <span *ngIf="loading" class="spinner-border spinner-border-sm me-1"></span>
    <i class="ti ti-eye me-1" *ngIf="!loading"></i>{{ 'report.generate' | transloco }}
  </button></div>
</div></div>

<!-- Aperçu du document (PDF) — l'utilisateur reste sur la page, puis télécharge/imprime -->
@if (previewUrl) {
  <div class="card mt-3"><div class="card-body">
    <div class="d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2">
      <h6 class="mb-0">{{ 'report.preview' | transloco }}</h6>
      <div class="d-flex gap-2">
        <button class="btn btn-outline-secondary btn-sm" (click)="printCurrent()"><i class="ti ti-printer me-1"></i>{{ 'report.print' | transloco }}</button>
        <button class="btn btn-primary btn-sm" (click)="downloadCurrent()"><i class="ti ti-download me-1"></i>{{ 'report.download' | transloco }}</button>
      </div>
    </div>
    <iframe #previewFrame [src]="previewUrl" style="width:100%;height:72vh;border:1px solid #ddd;border-radius:6px"></iframe>
  </div></div>
}
