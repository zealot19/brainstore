<div class="page-header"><div class="add-item d-flex"><div class="page-title"><h4>{{ 'report.title' | transloco }}</h4><h6>{{ 'report.subtitle' | transloco }}</h6></div></div></div>
<app-info-banner [text]="'report.info' | transloco"></app-info-banner>
<div class="card"><div class="card-body">
  <div class="row g-3">
    <div class="col-md-6">
      <label class="form-label">{{ 'report.f_report' | transloco }}</label>
      <select class="form-select" [(ngModel)]="selectedCode">
        @for (r of reports; track r.code) { <option [value]="r.code">{{ r.name }}</option> }
      </select>
    </div>
    <div class="col-md-3">
      <label class="form-label">{{ 'report.f_format' | transloco }}</label>
      <select class="form-select" [(ngModel)]="format">
        <option value="pdf">PDF</option><option value="xlsx">Excel</option><option value="csv">CSV</option>
      </select>
    </div>
  </div>

  <div class="row g-3 mt-1">
    @if (shows('date_from')) { <div class="col-md-3"><label class="form-label">{{ 'report.f_from' | transloco }}</label><input type="date" class="form-control" [(ngModel)]="f.date_from"></div> }
    @if (shows('date_to')) { <div class="col-md-3"><label class="form-label">{{ 'report.f_to' | transloco }}</label><input type="date" class="form-control" [(ngModel)]="f.date_to"></div> }
    @if (shows('year')) { <div class="col-md-2"><label class="form-label">{{ 'report.f_year' | transloco }}</label><input type="number" class="form-control" [(ngModel)]="f.year" placeholder="2026"></div> }
    @if (shows('agency')) { <div class="col-md-3"><label class="form-label">{{ 'report.f_agency' | transloco }}</label><select class="form-select" [(ngModel)]="f.agency"><option value="">{{ 'report.opt_all_f' | transloco }}</option>@for (a of agencies; track a.id) { <option [value]="a.id">{{ a.name }}</option> }</select></div> }
    @if (shows('register')) { <div class="col-md-3"><label class="form-label">{{ 'report.f_register' | transloco }}</label><select class="form-select" [(ngModel)]="f.register"><option value="">{{ 'report.opt_all_f' | transloco }}</option>@for (r of registers; track r.id) { <option [value]="r.id">{{ r.name }}</option> }</select></div> }
    @if (shows('vehicle')) { <div class="col-md-3"><label class="form-label">{{ 'report.f_vehicle' | transloco }}</label><input type="text" class="form-control" [(ngModel)]="f.vehicle"></div> }
  </div>

  <div class="mt-3"><button class="btn btn-primary" [disabled]="!selectedCode" (click)="generate()"><i class="ti ti-download me-1"></i>{{ 'report.generate' | transloco }}</button></div>
</div></div>
