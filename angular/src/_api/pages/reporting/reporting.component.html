<div class="page-header"><div class="add-item d-flex"><div class="page-title"><h4>Rapports</h4><h6>Générer les états (PDF, Excel, CSV)</h6></div></div></div>
<app-info-banner text="Sélectionnez un rapport, renseignez les filtres puis générez le fichier au format souhaité."></app-info-banner>
<div class="card"><div class="card-body">
  <div class="row g-3">
    <div class="col-md-6">
      <label class="form-label">Rapport</label>
      <select class="form-select" [(ngModel)]="selectedCode">
        @for (r of reports; track r.code) { <option [value]="r.code">{{ r.name }}</option> }
      </select>
    </div>
    <div class="col-md-3">
      <label class="form-label">Format</label>
      <select class="form-select" [(ngModel)]="format">
        <option value="pdf">PDF</option><option value="xlsx">Excel</option><option value="csv">CSV</option>
      </select>
    </div>
  </div>

  <div class="row g-3 mt-1">
    @if (shows('date_from')) { <div class="col-md-3"><label class="form-label">Du</label><input type="date" class="form-control" [(ngModel)]="f.date_from"></div> }
    @if (shows('date_to')) { <div class="col-md-3"><label class="form-label">Au</label><input type="date" class="form-control" [(ngModel)]="f.date_to"></div> }
    @if (shows('year')) { <div class="col-md-2"><label class="form-label">Année</label><input type="number" class="form-control" [(ngModel)]="f.year" placeholder="2026"></div> }
    @if (shows('agency')) { <div class="col-md-3"><label class="form-label">Agence</label><select class="form-select" [(ngModel)]="f.agency"><option value="">— Toutes —</option>@for (a of agencies; track a.id) { <option [value]="a.id">{{ a.name }}</option> }</select></div> }
    @if (shows('register')) { <div class="col-md-3"><label class="form-label">Caisse</label><select class="form-select" [(ngModel)]="f.register"><option value="">— Toutes —</option>@for (r of registers; track r.id) { <option [value]="r.id">{{ r.name }}</option> }</select></div> }
    @if (shows('vehicle')) { <div class="col-md-3"><label class="form-label">Véhicule (ID)</label><input type="text" class="form-control" [(ngModel)]="f.vehicle"></div> }
  </div>

  <div class="mt-3"><button class="btn btn-primary" [disabled]="!selectedCode" (click)="generate()"><i class="ti ti-download me-1"></i>Générer</button></div>
</div></div>
