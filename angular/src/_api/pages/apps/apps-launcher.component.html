<div class="launcher-page">
  <div class="launcher-inner">

    <!-- Marque -->
    <div class="launcher-brand">
      <img src="assets/img/logo.svg" alt="Brainstore" class="launcher-logo">
    </div>

    <!-- En-tête -->
    <div class="launcher-heading">
      <h2>Bienvenue{{ firstName ? ', ' + firstName : '' }}</h2>
      <p>Choisissez une application pour commencer</p>
    </div>

    @if (loading) {
      <div class="launcher-state">
        <div class="spinner-border text-primary"></div>
      </div>
    } @else if (items.length === 0) {
      <div class="launcher-state launcher-empty">
        <i class="ti ti-apps-off"></i>
        <span>Aucune application disponible pour votre compte.</span>
      </div>
    } @else {
      <div class="launcher-grid">
        @for (pkg of items; track pkg.code) {
          <button type="button"
                  class="launcher-card accent-{{ meta(pkg.code).color }}"
                  (click)="open(pkg)">
            <span class="launcher-badge">
              <i class="ti ti-{{ pkg.icon }}"></i>
            </span>
            <span class="launcher-body">
              <span class="launcher-title">{{ pkg.label }}</span>
              <span class="launcher-desc">{{ meta(pkg.code).desc }}</span>
            </span>
            <span class="launcher-open">
              Ouvrir <i class="ti ti-arrow-right"></i>
            </span>
          </button>
        }
      </div>
    }

  </div>

  <div class="launcher-footer">
    © {{ year }} Brainstore — Tous droits réservés
  </div>
</div>
