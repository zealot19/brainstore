<div class="ss-wrap" [class.disabled]="disabled">
  <button type="button" class="form-select text-start ss-toggle" (click)="toggle()" [disabled]="disabled">
    <span [class.text-muted]="!selectedLabel">{{ selectedLabel || placeholder }}</span>
    @if (value != null && !disabled) {
      <i class="ti ti-x ss-clear" (click)="clear($event)"></i>
    }
  </button>
  @if (open) {
    <div class="ss-panel">
      <div class="ss-search">
        <i class="ti ti-search"></i>
        <input type="text" class="form-control form-control-sm" [placeholder]="'shared.select.search_ph' | transloco" [(ngModel)]="search" (click)="$event.stopPropagation()" autofocus />
      </div>
      <div class="ss-list">
        @for (it of filtered; track it[valueKey]) {
          <div class="ss-option" [class.active]="it[valueKey] === value" (click)="choose(it)">{{ label(it) }}</div>
        } @empty {
          <div class="ss-empty">{{ 'shared.select.no_results' | transloco }}</div>
        }
      </div>
    </div>
  }
</div>
