<div class="page-header">
  <div class="add-item d-flex"><div class="page-title"><h4>{{ 'treasury.refund.title' | transloco }}</h4><h6>{{ 'treasury.refund.subtitle' | transloco }}</h6></div></div>
</div>
<div class="card"><div class="card-body" style="max-width:420px;">
  @if (errorMsg) { <div class="alert alert-danger py-2">{{ errorMsg }}</div> }
  @if (saved) { <div class="alert alert-success py-2">{{ 'treasury.refund.saved' | transloco }}</div> }
  <label class="form-label">{{ 'treasury.refund.label' | transloco }}</label>
  <div class="input-group">
    <input type="number" min="0" max="100" class="form-control" [(ngModel)]="rate" />
    <span class="input-group-text">%</span>
  </div>
  <small class="text-muted d-block mt-1">{{ 'treasury.refund.hint' | transloco }}</small>
  <button class="btn btn-primary mt-3" *hasPermission="'treasury.config.manage'" (click)="save()" [disabled]="saving">
    {{ (saving ? 'treasury.common.saving' : 'shared.actions.save') | transloco }}
  </button>
</div></div>
