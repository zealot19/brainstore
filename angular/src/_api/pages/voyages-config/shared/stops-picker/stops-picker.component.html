@if (disabled) {
  <p class="text-muted small mb-2">{{ 'vcfg.stops.need_od' | transloco }}</p>
} @else {
  <div class="row g-2 align-items-end mb-2">
    <div class="col-md-9">
      <label class="form-label small">{{ 'vcfg.stops.pick_ph' | transloco }}</label>
      <select class="form-select form-select-sm" multiple size="4" [(ngModel)]="picked">
        @for (o of options; track o.id) { <option [ngValue]="o.id">{{ o.name }}@if (o.code) { ({{ o.code }}) }</option> }
      </select>
    </div>
    <div class="col-md-3">
      <button type="button" class="btn btn-sm btn-outline-primary w-100" (click)="addPicked()" [disabled]="!picked.length">
        <i class="ti ti-plus me-1"></i>{{ 'vcfg.stops.add' | transloco }}
      </button>
    </div>
  </div>
}

<table class="table table-sm mb-0">
  <thead><tr><th style="width:36px">#</th><th>{{ 'vcfg.stops.col_stop' | transloco }}</th><th style="width:140px">{{ 'vcfg.stops.col_distance' | transloco }}</th><th style="width:48px"></th></tr></thead>
  <tbody>
    @for (s of stops; track $index) {
      <tr>
        <td>{{ $index + 1 }}</td>
        <td>{{ s.service_point_name }}</td>
        <td><input type="number" step="0.1" min="0" class="form-control form-control-sm"
                   [ngModel]="s.distance_from_origin_km" (ngModelChange)="onDistance($index, $event)" /></td>
        <td><a class="text-danger" (click)="removeAt($index)" [title]="'vcfg.stops.remove' | transloco"><i class="ti ti-trash"></i></a></td>
      </tr>
    } @empty { <tr><td colspan="4" class="text-muted small">{{ 'vcfg.stops.empty' | transloco }}</td></tr> }
  </tbody>
</table>
