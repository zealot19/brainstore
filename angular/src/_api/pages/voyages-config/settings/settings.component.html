<div class="page-header">
  <div class="add-item d-flex"><div class="page-title"><h4>Paramètres Voyages</h4><h6>Délais, quarts et notifications</h6></div></div>
</div>
<app-info-banner text="Paramètres généraux du module Voyages pour votre institution : délais de démarrage/arrêt, expiration des billets, durée de quart, alertes documents et notifications par défaut."></app-info-banner>
<div class="card">
  <div class="card-body">
    @if (loading) { <div class="text-center py-5"><div class="spinner-border text-primary"></div></div> }
    @else {
      <form [formGroup]="form" (ngSubmit)="save()">
        @if (errorMsg) { <div class="alert alert-danger py-2">{{ errorMsg }}</div> }
        @if (okMsg) { <div class="alert alert-success py-2">{{ okMsg }}</div> }
        <div class="row">
          <div class="col-md-3 mb-3"><label class="form-label">Délai de démarrage (h)</label><input formControlName="departure_lead_hours" type="number" min="0" class="form-control" /></div>
          <div class="col-md-3 mb-3"><label class="form-label">Délai d'arrêt (h)</label><input formControlName="arrival_grace_hours" type="number" min="0" class="form-control" /></div>
          <div class="col-md-3 mb-3"><label class="form-label">Expiration billet (jours)</label><input formControlName="ticket_expiry_days" type="number" min="0" class="form-control" /></div>
          <div class="col-md-3 mb-3"><label class="form-label">Durée de quart (h)</label><input formControlName="shift_duration_hours" type="number" min="0" class="form-control" /></div>
        </div>
        <div class="row">
          <div class="col-md-3 mb-3"><label class="form-label">Alerte documents (jours)</label><input formControlName="document_alert_days" type="number" min="0" class="form-control" /></div>
          <div class="col-md-3 mb-3"><label class="form-label">Délai d'archivage (jours)</label><input formControlName="archive_delay_days" type="number" min="0" class="form-control" /></div>
        </div>
        <div class="form-check form-switch mb-2"><input formControlName="auto_print_default" type="checkbox" class="form-check-input" id="vc-print" /><label class="form-check-label" for="vc-print">Impression automatique par défaut</label></div>
        <div class="form-check form-switch mb-3"><input formControlName="sms_notification_default" type="checkbox" class="form-check-input" id="vc-sms" /><label class="form-check-label" for="vc-sms">Notifications SMS par défaut</label></div>
        <button type="submit" class="btn btn-primary" [disabled]="saving"><span *ngIf="saving" class="spinner-border spinner-border-sm me-1"></span>Enregistrer</button>
      </form>
    }
  </div>
</div>
