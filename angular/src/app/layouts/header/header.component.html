<!-- Header -->
<div class="header">
  <div class="main-header">
    <!-- Logo -->
    <div class="header-left active" (mouseover)="miniSideBarMouseHover('over')" (mouseout)="miniSideBarMouseHover('out')">
      <a [routerLink]="routes.index" class="logo logo-normal"><img src="assets/img/logo.png" alt=""></a>
      <a [routerLink]="routes.index" class="logo logo-white"><img src="assets/img/logo-white.png" alt=""></a>
      <a [routerLink]="routes.index" class="logo-small"><img src="assets/img/logo-small.png" alt=""></a>
      <a id="toggle_btn" href="javascript:void(0);" (click)="toggleSidebar()">
        <i class="feather icon-chevrons-left fs-14"></i>
      </a>
    </div>
    <!-- /Logo -->

    <a id="mobile_btn" class="mobile_btn" (click)="togglesMobileSideBar()">
      <span class="bar-icon"><span></span><span></span><span></span></span>
    </a>

    <!-- Header Menu -->
    <ul class="nav user-menu align-items-center justify-content-end">

      <!-- Raccourcis (le <span> évite la règle .user-menu.nav>li>a qui écrase le style .btn) -->
      <ng-container *hasModule="'voyage'">
        <li class="nav-item me-2" *hasPermission="'ticketing.booking.create'">
          <span class="d-inline-flex"><a class="btn btn-primary" [routerLink]="routes.vbBookingNew">Nouvelle réservation</a></span>
        </li>
      </ng-container>

      <ng-container *hasModule="'colis'">
        <li class="nav-item me-2" *hasPermission="'ticketing.parcel.manage'">
          <span class="d-inline-flex"><a class="btn btn-outline-primary" [routerLink]="routes.vcgParcels" [queryParams]="{ new: 1 }">Nouveau colis</a></span>
        </li>
      </ng-container>

      <ng-container *hasModule="'bagages'">
        <li class="nav-item me-3" *hasPermission="'ticketing.luggage.manage'">
          <span class="d-inline-flex"><a class="btn btn-outline-primary" [routerLink]="routes.vcgBaggage" [queryParams]="{ new: 1 }">Nouveau bagage</a></span>
        </li>
      </ng-container>

      <!-- Langue (placeholder) -->
      <li class="nav-item dropdown me-2">
        <a href="javascript:void(0);" class="nav-link px-2 d-inline-flex align-items-center" data-bs-toggle="dropdown">
          <i class="ti ti-world me-1"></i>{{ currentLang }}
        </a>
        <div class="dropdown-menu dropdown-menu-end">
          <a href="javascript:void(0);" class="dropdown-item" (click)="setLang('FR')">Français</a>
          <a href="javascript:void(0);" class="dropdown-item" (click)="setLang('EN')">English</a>
        </div>
      </li>

      <!-- Déconnexion -->
      <li class="nav-item me-3">
        <a href="javascript:void(0);" class="nav-link px-2 d-inline-flex align-items-center" (click)="logout()" title="Déconnexion">
          <i class="ti ti-logout me-1"></i>Déconnexion
        </a>
      </li>

      <!-- Utilisateur connecté -->
      <li class="nav-item">
        <div class="d-flex align-items-center">
          <span class="avatar avatar-sm bg-primary text-white rounded-circle d-flex align-items-center justify-content-center me-2"
                style="width:34px;height:34px;font-size:.8rem;">{{ userInitials }}</span>
          <div class="lh-1">
            <div class="fw-semibold" style="font-size:.85rem;">{{ userName }}</div>
            <small class="text-muted">{{ userTitle }}</small>
          </div>
        </div>
      </li>

    </ul>
    <!-- /Header Menu -->
  </div>
</div>
<!-- /Header -->
