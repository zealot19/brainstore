# NGINX — serveur central ERP (online master), VARIANTE IP SEULE (HTTP, sans domaine).
# À copier dans /etc/nginx/sites-available/erp puis activer (voir le guide, section « IP seule »).
#
#  - Pas de nom de domaine : `server_name _;` capte n'importe quel hôte/IP.
#  - HTTP uniquement (port 80). PAS de certbot : Let's Encrypt ne délivre pas de
#    certificat pour une IP nue. Pour du HTTPS, il faut un domaine (voir nginx-erp.conf).
#  - Adaptez les chemins /opt/erp/... si vous avez cloné ailleurs.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Taille max des téléversements (logos, pièces jointes…)
    client_max_body_size 25m;

    # Frontend Angular (build de production)
    root /opt/erp/angular/dist/angular/browser;
    index index.html;

    # Fichiers médias téléversés (bind-mount du conteneur web)
    location /media/ {
        alias /opt/erp/deploy/vps/media/;
        access_log off;
        expires 7d;
    }

    # Backend Django : API, admin, statiques Django (servis par WhiteNoise)
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # ici "http" : le backend ne force donc pas le HTTPS
        proxy_read_timeout 120s;                      # création d'institution = requête longue
    }

    # Application mono-page (SPA) : tout le reste -> index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
