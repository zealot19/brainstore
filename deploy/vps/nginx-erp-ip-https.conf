# NGINX — serveur central ERP (online master), IP SEULE EN HTTPS (certificat AUTO-SIGNÉ).
# À copier dans /etc/nginx/sites-available/erp puis activer (voir le guide, « Option 2 »).
#
#  - HTTPS sur l'IP nue, sans domaine. Le certificat est AUTO-SIGNÉ : le navigateur
#    affichera un avertissement « connexion non privée » (chiffrement réel, mais non
#    certifié par une autorité de confiance). Pour un cadenas de confiance SANS acheter
#    de domaine, préférez l'Option 1 (sslip.io + Let's Encrypt) — voir le guide.
#  - Générez d'abord le certificat (voir le guide) :
#      sudo mkdir -p /etc/ssl/erp
#      sudo openssl req -x509 -nodes -days 825 -newkey rsa:2048 \
#        -keyout /etc/ssl/erp/selfsigned.key -out /etc/ssl/erp/selfsigned.crt \
#        -subj "/CN=VOTRE_IP" -addext "subjectAltName=IP:VOTRE_IP"
#  - Adaptez les chemins /opt/erp/... si vous avez cloné ailleurs.

# HTTP -> HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/ssl/erp/selfsigned.crt;
    ssl_certificate_key /etc/ssl/erp/selfsigned.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Taille max des téléversements (logos, pièces jointes…)
    client_max_body_size 25m;

    # Frontend Angular (build de production)
    root /opt/erp/angular/dist/angular/browser;
    index index.html;

    # Fichiers médias téléversés (bind-mount du conteneur web)
    location /media/ {
        alias /opt/erp/deploy/vps/media/;
        access_log off;
        expires 7d;
    }

    # Backend Django : API, admin, statiques Django (servis par WhiteNoise)
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # "https" : le backend sait que la connexion est chiffrée
        proxy_read_timeout 120s;
    }

    # Application mono-page (SPA) : tout le reste -> index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
