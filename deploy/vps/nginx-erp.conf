# NGINX — serveur central ERP (online master).
# À copier dans /etc/nginx/sites-available/erp puis activer (voir le guide).
#
#  - Remplacez erp.mondomaine.com par VOTRE domaine.
#  - Adaptez les chemins /opt/erp/... si vous avez cloné ailleurs.
#  - Ce fichier est en HTTP (port 80). `sudo certbot --nginx -d erp.mondomaine.com`
#    ajoutera AUTOMATIQUEMENT le bloc HTTPS (443), le certificat et la redirection
#    http -> https. Ne l'éditez plus à la main après certbot.

server {
    listen 80;
    listen [::]:80;
    server_name erp.mondomaine.com;

    # Taille max des téléversements (logos, pièces jointes…)
    client_max_body_size 25m;

    # Frontend Angular (build de production)
    root /opt/erp/angular/dist/angular/browser;
    index index.html;

    # Fichiers médias téléversés (bind-mount du conteneur web)
    location /media/ {
        alias /opt/erp/deploy/vps/media/;
        access_log off;
        expires 7d;
    }

    # Backend Django : API, admin, statiques Django (servis par WhiteNoise)
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # requis : le backend détecte le HTTPS via cet en-tête
        proxy_read_timeout 120s;                      # création d'institution = requête longue
    }

    # Application mono-page (SPA) : tout le reste -> index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
