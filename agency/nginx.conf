# nginx : sert l'appli Angular (SPA) + proxifie l'API/admin/statics/medias vers le backend.
# X-Forwarded-Proto=https : requis par les réglages de prod (SECURE_SSL_REDIRECT) pour
# éviter une boucle de redirection quand on sert en HTTP.
server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    # Backend Django : API, admin, statiques Django.
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # /media/ : le build Angular y émet polices d'icônes + images CSS (Tabler,
    # drapeaux…). On sert d'ABORD ces fichiers statiques ; sinon (média uploadé)
    # on relaie vers Django. Sans ça, /media/*.woff partait vers Django -> 404
    # -> icônes et images invisibles derrière nginx.
    location /media/ {
        root /usr/share/nginx/html;
        try_files $uri @django_media;
    }
    location @django_media {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Frontend Angular (application mono-page) — tout le reste.
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
