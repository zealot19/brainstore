# Blueprint Render — backend Django + PostgreSQL managé.
# Doc : https://render.com/docs/blueprint-spec
databases:
  - name: erp-db
    databaseName: erp
    plan: free            # 'free' expire après 90 j ; passer à 'basic' pour la prod

services:
  - type: web
    name: erp-backend
    runtime: python
    rootDir: backend       # les commandes s'exécutent depuis backend/
    plan: free
    branch: master         # brancher Render sur la branche déployée
    buildCommand: "pip install -r requirements/production.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application"
    healthCheckPath: /api/docs/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"              # Render ne supporte pas encore Python 3.14 (local)
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true          # Render génère une clé secrète
      - key: DATABASE_URL
        fromDatabase:
          name: erp-db
          property: connectionString
      # Défini dans le dashboard une fois le domaine Vercel connu :
      - key: CORS_ALLOWED_ORIGINS
        sync: false                  # ex. https://mon-erp.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        sync: false                  # ex. https://mon-erp.vercel.app
      # ALLOWED_HOSTS : le hostname Render est ajouté automatiquement (production.py).
      # Ajouter ici un domaine custom si besoin :
      - key: ALLOWED_HOSTS
        sync: false
